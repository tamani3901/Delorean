<style>

</style></head><body>

  <h1>HILL VALLEY 1955</h1>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ================= 調整用設定（GLB内の座標はフィート想定：raw座標） ================= */
const CFG={
  S:0.3048,                       // raw(ft)→m
  X0:-187.3, Y0:253, Z0:90.25,    // 時計塔の中心x / 道路中心y / 地面z (raw)  ← 世界原点にする
  clock:{x:-187.3,y:278.1,z:143.1,r:2.1,top:148.8}, // 時計の位置(raw)と半径(m)
  lane:3.2,                       // 道路の車線位置(z, m) 南側車線
  carX0:-300,                     // 車のスタート位置(m)
  V:88*0.44704,                   // 88mph
  carWidth:1.85,
  eye:[-215,280,440],             // 運転席の目の位置(車モデルraw座標)
  T0:8.0                          // 発進時刻(s)
};
const $=id=>document.getElementById(id);
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);

/* ================= ファイル読み込み ================= */
const loader=new THREE.GLTFLoader();
const parseGLB=buf=>new Promise((res,rej)=>loader.parse(buf,'',res,rej));
let mapBuf=null,carBuf=null;
function setSt(t){$('st').textContent=t}
async function tryFetch(){
  try{
    setSt('fetch中…');
    const [a,b]=await Promise.all([fetch('hill_vballey.glb'),fetch('DMC_delorean.glb')]);
    if(!a.ok||!b.ok) throw 0;
    mapBuf=await a.arrayBuffer(); carBuf=await b.arrayBuffer(); boot();
  }catch(e){ setSt(''); $('msg').textContent='自動読み込みできませんでした（file://ではブラウザが制限します）。'; $('pick').style.display='flex'; }
}
async function takeFiles(files){
  for(const f of files){ const n=f.name.toLowerCase(); if(n.includes('vballey')||n.includes('hill')) mapBuf=await f.arrayBuffer(); else if(n.includes('delorean')||n.includes('dmc')) carBuf=await f.arrayBuffer(); }
  if(mapBuf&&carBuf){ $('pick').style.display='none'; boot(); } else setSt('hill_vballey.glb と DMC_delorean.glb の両方が必要です');
}
$('fi').onchange=e=>takeFiles(e.target.files);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();takeFiles(e.dataTransfer.files)});
tryFetch();

/* ================= レンダラ ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070b);
scene.fog=new THREE.FogExp2(0x070b12,0.0105);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.08,2500);
scene.add(camera);
const controls=new THREE.OrbitControls(camera,canvas); controls.enabled=false; controls.target.set(0,8,0);

let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.6,.75,.8);
  composer.addPass(bloom);
  composer.addPass(new THREE.ShaderPass({uniforms:{tDiffuse:{value:null}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec3 x=texture2D(tDiffuse,vUv).rgb;x=x/(1.+x*.3);x=pow(x,vec3(1./2.2));float l=dot(x,vec3(.3,.59,.11));x=mix(vec3(l),x,.88);x*=vec3(.94,1.0,1.1);gl_FragColor=vec4(x,1.);}'}));
}else{ renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; }
function resize(){
  renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  if(composer){composer.setSize(innerWidth,innerHeight);} 
  $('drops').width=innerWidth;$('drops').height=innerHeight; layoutBars();
}
let letter=true;
function layoutBars(){ const h=letter?Math.max(0,(innerHeight-innerWidth/2.39)/2):0; $('bt').style.height=$('bb').style.height=h+'px'; }
addEventListener('resize',resize);

/* ================= ライト ================= */
const hemi=new THREE.HemisphereLight(0x5f73a0,0x1b1d24,.6); scene.add(hemi);
const dirF=new THREE.DirectionalLight(0xbcd0ff,0); dirF.position.set(40,140,-60); scene.add(dirF);
const clockL=new THREE.PointLight(0xffd7a0,1.6,26,1.4); clockL.position.set(0,12,-3); scene.add(clockL);
const lampL=new THREE.PointLight(0xffc27a,1.3,34,1.5); lampL.position.set(-10,5.5,2); scene.add(lampL);
const boomL=new THREE.PointLight(0xaed6ff,0,40,1.2); scene.add(boomL);
const fireL=new THREE.PointLight(0xff7a2a,0,38,1.5); scene.add(fireL);

/* ================= 空・環境 ================= */
const skyU={uT:{value:0},uF:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1200,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
 vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform float uT,uF;varying vec3 vP;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
 float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
 void main(){vec3 d=normalize(vP);float y=max(d.y,.02);vec2 uv=d.xz/(y+.25)*1.6+vec2(uT*.03,uT*.017);
 float c=fbm(uv),c2=fbm(uv*2.+5.+uT*.02);float cl=smoothstep(.28,.8,c*.7+c2*.4);
 vec3 base=mix(vec3(.02,.03,.05),vec3(.07,.09,.13),1.-y);vec3 col=base*(.55+cl*.9);
 col+=vec3(.55,.65,.95)*uF*(.2+cl*1.3)*(1.-y*.35);gl_FragColor=vec4(col,1.);}`}));
sky.renderOrder=-10; scene.add(sky);
(function env(){ // 反射用のダミー環境
  const e=new THREE.Scene(); e.add(new THREE.Mesh(new THREE.SphereGeometry(40,16,8),new THREE.MeshBasicMaterial({color:0x0b1020,side:THREE.BackSide})));
  const cols=[[3,2,1.2],[2.4,1.6,.9],[.8,1.2,2.6],[3,2.3,1.4]];
  for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(6,3),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));const c=cols[i%4];m.material.color.setRGB(c[0],c[1],c[2]);const a=i/8*Math.PI*2;m.position.set(Math.cos(a)*30,rnd(2,12),Math.sin(a)*30);m.lookAt(0,0,0);e.add(m);}
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(e,.03).texture; pm.dispose();
})();
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
const GLOW=glowTex();

/* ================= 雨 ================= */
const RN=14000, rainU={uTime:{value:0},uCam:{value:new THREE.Vector3()},uVel:{value:new THREE.Vector3()},uBox:{value:new THREE.Vector3(70,40,70)},uFl:{value:0}};
const rain=(function(){
  const g=new THREE.BufferGeometry(),a=new Float32Array(RN*6),e=new Float32Array(RN*2),r=new Float32Array(RN*2);
  for(let i=0;i<RN;i++){const x=Math.random(),y=Math.random(),z=Math.random(),q=Math.random();for(let k=0;k<2;k++){a.set([x,y,z],(i*2+k)*3);e[i*2+k]=k;r[i*2+k]=q;}}
  g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('e',new THREE.BufferAttribute(e,1));g.setAttribute('r',new THREE.BufferAttribute(r,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:rainU,
   vertexShader:`attribute float e;attribute float r;uniform float uTime;uniform vec3 uCam,uVel,uBox;varying float vE;
   void main(){vE=e;float sp=16.+r*7.;vec3 a=position;vec3 p;
   p.y=uCam.y-uBox.y*.5+mod(a.y*uBox.y-uTime*sp,uBox.y);
   p.x=uCam.x+mod(a.x*uBox.x-uTime*2.5-uCam.x,uBox.x)-uBox.x*.5;
   p.z=uCam.z+mod(a.z*uBox.z+uTime*.8-uCam.z,uBox.z)-uBox.z*.5;
   vec3 v=vec3(-2.5-uVel.x*.35,-sp,-.8-uVel.z*.35);p-=normalize(v)*e*(.55+r*.5);
   gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}`,
   fragmentShader:`uniform float uFl;varying float vE;void main(){float a=(1.-vE)*.38+vE*.02;gl_FragColor=vec4(vec3(.62,.72,.9)+uFl*.6,a*(1.+uFl*1.6));}`});
  const l=new THREE.LineSegments(g,m);l.frustumCulled=false;l.renderOrder=20;return l;})();
scene.add(rain);

/* ================= パーティクル ================= */
function makeParticles(max,colA,colB){
  const g=new THREE.BufferGeometry(),pos=new Float32Array(max*3),life=new Float32Array(max),sz=new Float32Array(max),vel=new Float32Array(max*3),ml=new Float32Array(max).fill(1);
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('life',new THREE.BufferAttribute(life,1));g.setAttribute('sz',new THREE.BufferAttribute(sz,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
   uniforms:{uS:{value:innerHeight*.8},cA:{value:new THREE.Vector3(...colA)},cB:{value:new THREE.Vector3(...colB)}},
   vertexShader:'attribute float life;attribute float sz;varying float vL;uniform float uS;void main(){vL=life;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=life>0.?sz*uS/(-mv.z):0.;gl_Position=projectionMatrix*mv;}',
   fragmentShader:'varying float vL;uniform vec3 cA,cB;void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.||vL<=0.)discard;float a=pow(1.-r,1.7)*clamp(vL,0.,1.);gl_FragColor=vec4(mix(cB,cA,vL)*a*1.8,a);}'});
  const obj=new THREE.Points(g,m);obj.frustumCulled=false;let head=0;
  return{obj,emit(x,y,z,vx,vy,vz,l,s){const i=head++%max;pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;vel[i*3]=vx;vel[i*3+1]=vy;vel[i*3+2]=vz;life[i]=1;ml[i]=l;sz[i]=s;},
   update(dt,grav){for(let i=0;i<max;i++){if(life[i]<=0)continue;life[i]-=dt/ml[i];pos[i*3]+=vel[i*3]*dt;pos[i*3+1]+=vel[i*3+1]*dt;pos[i*3+2]+=vel[i*3+2]*dt;vel[i*3+1]+=grav*dt;}
    g.attributes.position.needsUpdate=g.attributes.life.needsUpdate=g.attributes.sz.needsUpdate=true;},
   clear(){life.fill(0)}};
}
const sparks=makeParticles(600,[1,.9,.6],[.6,.2,.05]);   scene.add(sparks.obj);
const flames=makeParticles(2500,[1,.55,.12],[.45,.06,0]); scene.add(flames.obj);

/* ================= 電撃ライン ================= */
function makeBoltMesh(maxSeg,color){
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(maxSeg*6),3));g.setDrawRange(0,0);
  const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));l.frustumCulled=false;return l;}
function jag(a,b,d,depth){let p=[a.clone(),b.clone()];for(let i=0;i<depth;i++){const n=[];for(let j=0;j<p.length-1;j++){const m=p[j].clone().add(p[j+1]).multiplyScalar(.5);m.x+=rnd(-.5,.5)*d;m.y+=rnd(-.5,.5)*d*.5;m.z+=rnd(-.5,.5)*d;n.push(p[j],m);}n.push(p[p.length-1]);p=n;d*=.55;}return p;}
function fillBolt(mesh,polylines){const arr=mesh.geometry.attributes.position.array;let n=0;const max=arr.length/3;
  for(const pl of polylines)for(let i=0;i<pl.length-1&&n+2<=max;i++){arr[n*3]=pl[i].x;arr[n*3+1]=pl[i].y;arr[n*3+2]=pl[i].z;n++;arr[n*3]=pl[i+1].x;arr[n*3+1]=pl[i+1].y;arr[n*3+2]=pl[i+1].z;n++;}
  mesh.geometry.setDrawRange(0,n);mesh.geometry.attributes.position.needsUpdate=true;}
const skyBolt=makeBoltMesh(2500,0xd8ebff), arcBolt=makeBoltMesh(1200,0x9fd4ff), cableBolt=makeBoltMesh(600,0xcfe8ff);
scene.add(skyBolt,arcBolt,cableBolt);

/* ================= 窓テクスチャ・街並み ================= */
function winTex(lit,seed){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');let s=seed;const R=()=>((s=(s*16807)%2147483647)/2147483647);
  g.fillStyle=lit?'#000':'#3c3f47';g.fillRect(0,0,128,128);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){const on=R()<.38;g.fillStyle=lit?(on?(R()<.5?'#ffcf80':'#ffe6b0'):'#000'):(on?'#e6c88c':'#15181f');g.fillRect(x*32+6,y*32+6,20,20);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;if(!lit)t.encoding=THREE.sRGBEncoding;return t;}
function buildExtension(world){
  const geos=[];
  const addSide=(s,x0,x1)=>{let x=x0;while(x<x1){const w=rnd(11,22),d=rnd(10,16),h=rnd(8,22);
    const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*Math.max(w,d)/6.4,uv.getY(i)*h/6.4);
    g.translate(x+w/2,h/2,s*(9.5+d/2));geos.push(g);x+=w+rnd(.3,1.2);}};
  [-1,1].forEach(s=>{addSide(s,-340,-62);addSide(s,60,200);});
  const mg=THREE.BufferGeometryUtils.mergeBufferGeometries(geos);
  const mat=new THREE.MeshStandardMaterial({map:winTex(false,7),emissiveMap:winTex(true,7),emissive:new THREE.Color(1,.82,.55),emissiveIntensity:1.1,roughness:.75,metalness:.05});
  world.add(new THREE.Mesh(mg,mat));
  // 道路・歩道
  const road=new THREE.Mesh(new THREE.PlaneGeometry(560,10),new THREE.MeshStandardMaterial({color:0x12151a,roughness:.22,metalness:.45,transparent:true,opacity:.93,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
  road.rotation.x=-Math.PI/2;road.position.set(-70,.03,0);world.add(road);
  const sw=new THREE.MeshStandardMaterial({color:0x2a2c31,roughness:.5,metalness:.2});
  [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.BoxGeometry(340,.16,4.4),sw);p.position.set(-170,.08,s*7.2);world.add(p);const q=p.clone();q.scale.x=.6;q.position.set(128,.08,s*7.2);world.add(q);});
  // 街灯
  const poles=[],pools=[],pts=[];
  for(let x=-330;x<=200;x+=26)for(const s of[-1,1]){ if(x>-60&&x<60)continue;
    const c=new THREE.CylinderGeometry(.07,.1,6.2,6);c.translate(x,3.1,s*5.6);poles.push(c);
    const a=new THREE.CylinderGeometry(.05,.05,1.6,5);a.rotateZ(Math.PI/2);a.translate(x,6.2,s*(5.6-s*.7));poles.push(a);
    const cc=new THREE.CircleGeometry(6.5,20);cc.rotateX(-Math.PI/2);cc.translate(x,.05,s*3);pools.push(cc);pts.push(x,6.1,s*4.9);}
  world.add(new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(poles),new THREE.MeshStandardMaterial({color:0x1b1d22,roughness:.6,metalness:.6})));
  world.add(new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(pools),new THREE.MeshBasicMaterial({color:0xffb45e,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false,fog:true})));
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  world.add(new THREE.Points(pg,new THREE.PointsMaterial({map:GLOW,color:0xffc47a,size:3.4,sizeAttenuation:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));
}

/* ================= マップ結合 ================= */
function mergeStatic(root){
  root.updateMatrixWorld(true);const groups=new Map();
  root.traverse(o=>{ if(!o.isMesh||!o.geometry.attributes.position)return; let g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);
    for(const k of Object.keys(g.attributes))if(!['position','normal','uv'].includes(k))g.deleteAttribute(k);

    if(!g.attributes.normal)g.computeVertexNormals();
    if(!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const m=Array.isArray(o.material)?o.material[0]:o.material;if(!groups.has(m))groups.set(m,[]);groups.get(m).push(g);});

      const main=jag(a,b,26,6),pl=[main];for(let i=0;i<4;i++){const s=main[Math.floor(rnd(8,main.length-8))];pl.push(jag(s,s.clone().add(new THREE.Vector3(rnd(-40,40),-rnd(20,60),rnd(-40,40))),14,4));}
      fillBolt(skyBolt,pl);skyBolt.material.opacity=e<.5?1:clamp((.7-e)/.2,0,1);
      if(!skyBolt.userData.f){skyBolt.userData.f=1;triggerFlash(1.25,.05,1.4);shakeE=1.4;}}else if(e>=.7){skyBolt.geometry.setDrawRange(0,0);}
    // ケーブルを走る電流
    if(e>.28&&e<.62){const s=(e-.28)/.34,[C,P]=wirePts;const q=C.clone().lerp(P,s);cableMat.emissive.setRGB(.5,.7,1);
      const pl=[];for(let i=0;i<4;i++){const a=C.clone().lerp(P,Math.max(0,s-.25)),b=q.clone();pl.push(jag(a,b,.35,4));}fillBolt(cableBolt,pl);
      for(let i=0;i<3;i++)sparks.emit(q.x,q.y,q.z,rnd(-2,2),rnd(0,3),rnd(-2,2),rnd(.2,.5),rnd(.1,.2));
    }else cableBolt.geometry.setDrawRange(0,0);
    // 車体を包むアーク
    if(e>.55&&e<1.1){const tip=worldTip(),pls=[];const bx=car.position;
      for(let i=0;i<14;i++){const from=i<5?tip:new THREE.Vector3(bx.x+rnd(-1.6,1.6),rnd(.2,1.2),bx.z+rnd(-.9,.9));const to=new THREE.Vector3(bx.x+rnd(-2.4,2.4),rnd(0,1.4),bx.z+rnd(-1.4,1.4));pls.push(jag(from,to,.8,4));}
      fillBolt(arcBolt,pls);boomL.position.set(bx.x,1.3,bx.z);boomL.intensity=rnd(10,26);
      for(let i=0;i<4;i++)sparks.emit(bx.x+rnd(-1,1),rnd(.2,1.4),bx.z+rnd(-.6,.6),rnd(-3,3),rnd(0,4),rnd(-3,3),rnd(.2,.5),rnd(.1,.25));
      car.userData.glow=1;}
    // 消失
    if(e>=1.1){vanished=true;car.visible=false;arcBolt.geometry.setDrawRange(0,0);boomL.intensity=0;trails=true;cableMat.emissive.setHex(0);
      $('flash').style.opacity=1;flashE=Math.max(flashE,1.6);boom();thunder(.1,1.5);shakeE=2;
      for(let i=0;i<200;i++)sparks.emit(xv(),rnd(.1,2),CFG.lane+rnd(-1,1),rnd(-6,6),rnd(0,8),rnd(-4,4),rnd(.4,1.2),rnd(.15,.5));
      fireL.position.set(xv()-18,1.4,CFG.lane);}
  }
  // 炎の轍
  if(trails){const x1=xv(),x0=x1-44;const fl=.8+.2*Math.sin(t*37)+rnd(-.1,.1);fireL.intensity=3.2*fl;
    for(const dz of[-.8,.8])for(let i=0;i<14;i++){const x=rnd(x0,x1);const k=clamp((x-x0)/(x1-x0),0,1);flames.emit(x,.05,CFG.lane+dz+rnd(-.12,.12),rnd(-.2,.2),rnd(1.2,3.2)*(.5+k),rnd(-.2,.2),rnd(.6,1.4),rnd(.8,1.8));}
    if(Math.random()<.4)sparks.emit(rnd(x0,x1),.2,CFG.lane+rnd(-1,1),rnd(-1,1),rnd(1,4),rnd(-1,1),rnd(.5,1.2),rnd(.08,.18));}
  // 白飛びのフェード
  const fo=parseFloat($('flash').style.opacity||0);if(fo>0)$('flash').style.opacity=Math.max(0,fo-dt*.8);
}
let clockPing=0;

/* ================= カメラ ================= */
const carPos=new THREE.Vector3();
function setCam(px,py,pz,lx,ly,lz,fov){camera.position.set(px,py,pz);camera.lookAt(lx,ly,lz);if(fov&&Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix();}}
function camChase(cs){const sp=cs.v/CFG.V;setCam(cs.x-7.4+sp*.8,2.1,CFG.lane+1.9,cs.x+8,1.0,CFG.lane,52+sp*16);view='chase';}
function camCockpit(cs){const p=car.localToWorld(eyeLocal.clone()),l=car.localToWorld(lookLocal.clone());camera.position.copy(p);camera.lookAt(l);const f=62+cs.v/CFG.V*10;if(Math.abs(camera.fov-f)>.01){camera.fov=f;camera.updateProjectionMatrix();}view='cockpit';}
function camPlaza(t){const k=clamp(t/9,0,1);setCam(lerp(-28,-21,k),lerp(2.0,2.6,k),lerp(16,13,k),0,11,-7,42);view='plaza';}
function camWide(){setCam(-34,2.6,20,0,10,-4,40);view='wide';}
function camClock(){setCam(-5.5,1.6,4.2,0,13.5,-7.6,46);view='tower';}
function camLow(cs){setCam(-1.5,1.0,4.8,cs.x+10,1.1,CFG.lane,34);view='low';}
function camTrail(t){const k=clamp((t-THIT-3.2)/6,0,1);setCam(lerp(-3,10,k),1.1,5.2,lerp(18,30,k),.6,CFG.lane,50);view='trail';}
function updateCamera(t,dt,cs){
  car.getWorldPosition(carPos);
  if(mode===4){if(!controls.enabled){controls.enabled=true;camera.position.set(-40,12,30);camera.fov=50;camera.updateProjectionMatrix();}controls.update();view='free';return;}
  controls.enabled=false;
  if(mode===1)camChase(cs);else if(mode===2)camCockpit(cs);else if(mode===3)camPlaza(t);
  else{ // 映画モード（自動カット割り）
    if(t<CFG.T0+.2)camPlaza(t);
    else if(t<CFG.T0+3.6)camChase(cs);
    else if(t<CFG.T0+6.4)camCockpit(cs);
    else if(t<THIT-5.2)camClock();
    else if(t<THIT-1.9)camLow(cs);
    else if(t<THIT)camCockpit(cs);
    else if(t<THIT+3.2)camWide();
    else camTrail(t);
  }
  // 手持ち風の揺れ
  const sp=cs.v/CFG.V,amp=(view==='cockpit'?.004:view==='chase'?.012:.0025)*(.3+sp)+shakeE*.03;
  camera.position.x+=rnd(-1,1)*amp;camera.position.y+=rnd(-1,1)*amp;camera.position.z+=rnd(-1,1)*amp;
  if(view==='plaza'||view==='wide'||view==='low'||view==='tower'){camera.rotation.z+=rnd(-1,1)*.0006*(1+shakeE*6);}
}

/* ================= メインループ ================= */
let last=performance.now(),started=false,gf=0;
const subEl=$('sub');
function frame(now){
  requestAnimationFrame(frame);if(!ready||!started)return;
  let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)dt=0;
  const prev=simT;simT+=dt;const t=simT;
  const cs=carState(t);
  if(car){car.position.set(cs.x,0,CFG.lane);if(!vanished)car.userData.glow*=.9;}
  stepEvents(prev,t,dt);
  // 雷フラッシュの減衰・キュー
  for(let i=flashQ.length-1;i>=0;i--)if(t>=flashQ[i][0]){flashE=Math.max(flashE,flashQ[i][1]);flashQ.splice(i,1);}
  flashE*=Math.pow(.0009,dt);if(flashE<.002)flashE=0;shakeE*=Math.pow(.03,dt);
  const fl=Math.min(flashE,1.6);
  hemi.intensity=.6+fl*1.7;dirF.intensity=fl*3.4;skyU.uF.value=fl;rainU.uFl.value=fl;skyU.uT.value=now*.001;
  scene.fog.color.setRGB(.027+fl*.28,.043+fl*.32,.07+fl*.45);
  clockL.intensity=1.6+clockPing*.0;
  if(bloom)bloom.strength=.6+fl*.7;
  // 車のヘッドライト（電撃時は明滅）
  if(car){car.children.forEach(o=>{if(o.isSpotLight)o.intensity=3.2*(car.userData.glow>0?rnd(.2,1.4):1);});}
  updateCamera(t,dt,cs);
  sky.position.copy(camera.position);
  rainU.uTime.value=now*.001;rainU.uCam.value.copy(camera.position);
  rainU.uVel.value.set(cs.v*(view==='cockpit'||view==='chase'?1:0),0,0);
  sparks.update(dt,-9);flames.update(dt,1.5);
  // 音
  const dist=camera.position.distanceTo(carPos);const inCar=view==='cockpit';
  engineUpdate(cs.v,dist,inCar,t>=CFG.T0-.4&&!vanished);ambienceUpdate(inCar);
  // 車内HUD
  $('tc').style.display=inCar?'block':'none';$('drops').style.display=inCar?'block':'none';
  if(inCar){const hm=t<8.5?[10,0]:t<THIT-5?[10,3]:[10,4];drawTC({mon:'NOV',d:12,y:1955,pm:1,h:hm[0]-0,m:hm[1]},cs.v>CFG.V*.82&&Math.random()<.9);drawDrops(dt||.016,cs.v*.44);
    const mph=Math.round(cs.v/.44704);if(gf++%2==0){}}
  // 字幕
  const c=caps.find(c=>t>=c[0]&&t<c[1]);if(c){if(subEl.textContent!==c[2])subEl.textContent=c[2];subEl.style.opacity=1;}else subEl.style.opacity=0;
  // 簡易HUD
  if(gf%10===0)$('hud').textContent=(hudOn?'1 追従  2 車内  3 広場  4 自由視点(ドラッグ)  5 映画モード\nSpace 一時停止  R 最初から  M 消音  L 黒帯  H このヘルプ\n':'')+(hudOn?`t=${t.toFixed(1)}s   ${Math.round(cs.v/.44704)} mph   [${view}]`:'');
  gf++;
  if(composer)composer.render();else renderer.render(scene,camera);
}
let hudOn=true;
// フィルムグレイン
const gcv=$('grain'),gctx=gcv.getContext('2d');let gfi=0;
setInterval(()=>{const im=gctx.createImageData(160,90);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}gctx.putImageData(im,0,0);},70);

$('go').onclick=()=>{ $('ov').style.display='none';audioInit();A.ctx.resume();started=true;resize();resetSim();last=performance.now();setTimeout(()=>{hudOn=false;},12000);};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if('12345'.includes(k)&&k.length===1){mode=+k;hudOn=true;}
  else if(k===' '){paused=!paused;e.preventDefault();if(A.ctx){paused?A.ctx.suspend():A.ctx.resume();}}
  else if(k==='r'){resetSim();}
  else if(k==='m'){if(A.ctx){A.master.gain.value=A.master.gain.value>0?0:.9;}}
  else if(k==='l'){letter=!letter;layoutBars();}
  else if(k==='h'){hudOn=!hudOn;}
});
resize();layoutBars();requestAnimationFrame(frame);
</script></body></html>
